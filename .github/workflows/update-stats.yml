name: Update Monkeytype stats

on:
  schedule:
    # Daily at 06:00 UTC. Change the cron (https://crontab.guru) if you
    # want a different cadence; keep `workflow_dispatch` so you can also
    # update stats manually from the Actions tab.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch personal bests
        env:
          MONKEYTYPE_APE_KEY: ${{ secrets.MONKEYTYPE_APE_KEY }}
        run: node scripts/fetch-monkeytype-stats.mjs
      - name: Commit when stats changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stats.json
          git diff --cached --quiet || git commit -m "chore: update monkeytype stats"
          git push
