<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aurnob Rahman — Link Garden</title>
    <meta
      name="description"
      content="Every link in one quiet place — socials, shop, work, and contact. Grown and tended by Aurnob Rahman."
    />
    <meta name="theme-color" content="#16211C" />

    <!-- Social sharing previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aurnob.dev/link-garden/" />
    <meta property="og:title" content="Aurnob Rahman — Link Garden" />
    <meta
      property="og:description"
      content="Every link in one quiet place — socials, shop, work, and contact."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurnob Rahman — Link Garden" />
    <meta
      name="twitter:description"
      content="Every link in one quiet place — socials, shop, work, and contact."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts: Newsreader (display serif), Karla (body), Space Mono (specimen labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('link-garden:theme')
        if (!t && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light'
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
